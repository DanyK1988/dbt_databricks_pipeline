version: 2

models:
  - name: bronze_sales
    config:
      materialized: table
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique
      - name: gross_amount
        data_tests:
          - generic_non_negative
      - name: net_amount
        data_tests:
          - generic_non_negative



  - name: bronze_returns
    config:
      materialized: table

  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null
      - name: store_name
        data_tests:
            - accepted_values: 
                arguments:
                  values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
                config:
                  severity: warn


  